<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Dashboard · GlowBook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header id="topbar"></header>

  <main class="container" style="padding-bottom:30px" id="root"></main>

  <div id="footer"></div>
  <nav id="bottomnav"></nav>
  <div id="toast"></div>

  <script src="js/data.js"></script>
  <script>
    renderChrome("account");

    const user = Auth.user();
    const root = document.getElementById("root");

    // Owner / manager only
    if (!user || user.role !== "owner") {
      root.innerHTML = `
        <div class="empty card" style="margin-top:30px">
          <div class="big">🔐</div>
          <h2>The dashboard is for the boss</h2>
          <p style="font-size:13px; margin-top:8px">
            Login as the salon owner to see today's appointments, revenue and every stylist's book.
          </p>
          <a class="btn btn-primary btn-sm" href="login.html" style="margin-top:14px">👑 Owner Login</a>
        </div>`;
    } else {
      renderDashboard();
    }

    function renderDashboard() {
      const all = bookings();
      const today = new Date().toISOString().split("T")[0];
      const active = all.filter((b) => b.status === "pending" || b.status === "confirmed");
      const todayList = all.filter((b) => b.date === today);
      const revenue = all.filter((b) => b.status === "completed").reduce((s, b) => s + b.price, 0);
      const pipeline = active.reduce((s, b) => s + b.price, 0);

      root.innerHTML = `
        <section class="section" style="padding-top:18px">
          <div class="section-head">
            <h2>Owner Dashboard 👑</h2>
            <span style="font-size:11.5px;color:var(--plum-soft)">${dateLabel(today)}</span>
          </div>
          <div class="stat-grid">
            <div class="stat-card">
              <div class="num">${todayList.length}</div>
              <div class="lbl">appointments today</div>
            </div>
            <div class="stat-card gold">
              <div class="num">${all.filter((b) => b.status === "pending").length}</div>
              <div class="lbl">awaiting confirmation</div>
            </div>
            <div class="stat-card">
              <div class="num">${naira(revenue)}</div>
              <div class="lbl">earned from completed</div>
            </div>
            <div class="stat-card gold">
              <div class="num">${naira(pipeline)}</div>
              <div class="lbl">expected from active</div>
            </div>
          </div>

          <div class="card" style="margin-bottom:20px">
            <h3 style="font-size:15px; margin-bottom:10px">Stylist workload (active bookings)</h3>
            ${GLOW.STYLISTS.map((t) => {
              const n = active.filter((b) => b.stylistId === t.id).length;
              const pct = active.length ? Math.round((n / active.length) * 100) : 0;
              return `
              <div style="margin-bottom:12px">
                <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px">
                  <b>${t.name} — ${t.role}</b><span style="color:var(--plum-soft)">${n} job${n === 1 ? "" : "s"}</span>
                </div>
                <div style="height:8px; background:var(--blush); border-radius:999px; overflow:hidden">
                  <div style="height:100%; width:${pct}%; background:linear-gradient(90deg,var(--rose),var(--gold)); border-radius:999px"></div>
                </div>
              </div>`;
            }).join("")}
          </div>

          <div class="section-head">
            <h2 style="font-size:18px">All Appointments</h2>
            <a href="bookings.html">Customer view →</a>
          </div>
          <div id="allList"></div>
        </section>`;

      renderAllList();
    }

    let dashFilter = "all";
    function renderAllList() {
      const el = document.getElementById("allList");
      if (!el) return;
      const list = bookings()
        .filter((b) => dashFilter === "all" || b.status === dashFilter)
        .sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));

      el.innerHTML =
        `<div class="filter-bar">` +
        ["all", "pending", "confirmed", "completed", "cancelled"]
          .map((s) => `<span class="chip ${dashFilter === s ? "on" : ""}" data-f="${s}">${s[0].toUpperCase() + s.slice(1)}</span>`)
          .join("") +
        `</div>` +
        (list.length
          ? list
              .map((b) => {
                const st = stylistById(b.stylistId);
                return `
            <div class="appt-card">
              <div class="appt-top">
                <div>
                  <div class="appt-service">${b.service}</div>
                  <div class="appt-when">${dateLabel(b.date)} · ${timeLabel(b.time)}</div>
                </div>
                <span class="status ${b.status}">${b.status}</span>
              </div>
              <div class="appt-meta">
                <span>👤 <b>${b.customer}</b></span>
                <span>📞 <b>${b.phone}</b></span>
                <span>✂️ <b>${st ? st.name : "Unassigned"}</b></span>
                <span>💰 <b>${naira(b.price)}</b></span>
                <span>💳 <b>${b.pay || "At salon"}</b></span>
                <span>🆔 <b>${b.id}</b></span>
              </div>
              ${b.note ? `<div class="appt-meta" style="margin-top:6px">📝 ${b.note}</div>` : ""}
              <div class="appt-actions">
                ${b.status === "pending" ? `<button class="btn btn-primary btn-sm" onclick="setStatus('${b.id}','confirmed')">✓ Confirm</button>` : ""}
                ${b.status !== "completed" && b.status !== "cancelled" ? `<button class="btn btn-gold btn-sm" onclick="setStatus('${b.id}','completed')">✔ Mark done</button>` : ""}
                ${b.status !== "completed" && b.status !== "cancelled" ? `<button class="btn btn-outline btn-sm" onclick="setStatus('${b.id}','cancelled')">✕ Cancel</button>` : ""}
              </div>
            </div>`;
              })
              .join("")
          : `<div class="empty card"><div class="big">📭</div>Nothing here yet.</div>`);

      el.querySelectorAll(".chip").forEach(
        (c) => (c.onclick = () => { dashFilter = c.dataset.f; renderAllList(); })
      );
    }

    window.setStatus = function (id, status) {
      const list = bookings();
      const bk = list.find((b) => b.id === id);
      if (!bk) return;
      bk.status = status;
      saveBookings(list);
      toast(status === "completed" ? "Marked done ✅ revenue updated" : "Booking " + status + " ✓");
      renderDashboard();
    };
  </script>
</body>
</html>
